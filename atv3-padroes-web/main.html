<!-- Criar um formulário para registrar os interesses musicais de uma pessoa;
Deve permitir selecionar 1 ou mais estilos musicais preferidos;
Deve permitir selecionar 3 álbuns preferidos da lista da atividade de tabelas. mostrar os dados como uma lista de checkboxes;
O primeiro elemento do formulário deve receber foco automaticamente;
Aplicar um estilo coerente em todo o formulário: bom espaçamento entre elementos, indicação de quais elementos são obrigatórios, destaque de qual elemento está com foco, fornecer rótulos para todos os elementos;
Adicionar formatação ao texto dos botões;
Criar agrupamentos de elementos por assunto;
Para listas longas de opções, fornecer agrupamento de opções;
Definir os padrões mínimos (p.ex. telefone, email);
Criar validação para todos os campos em Javascript;
Para itens que tiveram problema de validação, adicionar a informação do problema encontrado junto ao elemento de entrada;-->

<!DOCTYPE html>

<html lang="pt-BR">

    <head>
        <title>ATV3 - Padrões Web</title>
        <link rel="stylesheet" href="./stylesheet.css">
        <script defer src="./index.js"></script>
    </head>

    <body>
        <header>

            <svg class="logo" viewBox="0 0 400 400" height="5em" width="5em">
                <rect x="0" y="0" width="50%" height="50%" fill="tomato" opacity="0.75"></rect>
                <rect x="20%" y="20%" width="50%" height="50%" fill="slategrey" opacity="0. 75"></rect>
                <rect x="40%" y="40%" width="50%" height="50%" fill="olive" opacity="0.75"></rect>
            </svg>
            <h1>Musicas.com</h1>
        
        </header>

        <main>
            
            <form>
                <fieldset id="dados-pessoais">
                    <legend>Insira os dados pessoais</legend>

                    <label for="nome" class="obrigatorio">Nome</label>
                    <input type="text" name="nome" id="nome" required autofocus>

                    <label for="email" class="obrigatorio">Email</label>
                    <input type="email" name="email" id="email" required>

                    <label for="telefone" class="obrigatorio">Telefone</label>
                    <input type="tel" name="telefone" id="telefone" required placeholder="(XX) XXXXX-XXXX" >

                    <label for="nascimento" class="obrigatorio">Data de Nascimento</label>
                    <input type="date" name="nascimento" id="nascimento" required>

                    <label for="foto">Foto de Perfil <small>.png ou .jpeg</small></label>
                    <input type="file" name="foto" id="foto" accept="image/png, image/jpeg">
                </fieldset>

                <p>
                    <small>Os dados abaixo (de gênero, álbuns e artistas) foram escolhidos com base nos 50 álbuns mais vendidos.</small>
                </p>
                <fieldset id="dados-estilo">
                    <legend>Selecione seu gênero musical preferido</legend>
 
                    <label for="folk">
                        <input type="radio" name="genero-preferido" value="folk" id="folk" required>
                        Folk
                    </label>
                    
                    <label for="blues">
                        <input type="radio" name="genero-preferido" value="blues" id="blues">
                        Blues
                    </label>  

                    <label for="pop">
                        <input type="radio" name="genero-preferido" value="pop" id="pop">
                        Pop
                    </label>  

                    <label for="hard-rock">
                        <input type="radio" name="genero-preferido" value="hard-rock" id="hard-rock">    
                        Hard Rock
                    </label>

                    <label for="psychedelic-rock">
                        <input type="radio" name="genero-preferido" value="psychedelic-rock" id="psychedelic-rock">
                        Psychedelic Rock
                    </label>

                    <label for="progressive-rock">
                        <input type="radio" name="genero-preferido" value="progressive-rock" id="progressive-rock">
                        Progressive Rock
                    </label>

                    <label for="classic-rock">
                        <input type="radio" name="genero-preferido" value="classic-rock" id="classic-rock">
                        Classic Rock
                    </label>

                    <label for="pop-rock">
                        <input type="radio" name="genero-preferido" value="pop-rock" id="pop-rock">
                        Pop Rock
                    </label>  

                    <label for="heavy-metal">
                        <input type="radio" name="genero-preferido" value="heavy-metal" id="heavy-metal">
                        Heavy Metal
                    </label>

                    <label for="nu-metal">
                        <input type="radio" name="genero-preferido" value="nu-metal" id="nu-metal">
                        Nu Metal
                    </label> 

                </fieldset>

                <fieldset id="melhores-albuns">
                    <legend>Selecione até 3 melhores álbuns</legend>
                </fieldset>

                <label for="melhor-artista">Selecione o melhor artista:</label>
                <select id="melhor-artista">
                    <option value="">Nenhum</option>
                </select>
                
                <fieldset>
                    <legend>Seus artistas preferidos</legend>
                    <label for="lista-artistas">Cite alguns de seus artistas favoritos (um por linha):</label>
                    <textarea id="lista-artistas" name="lista-artistas" rows="5"></textarea>
                </fieldset>

                <div class="botoes">
                    <input type="reset" value="Limpar">
                    <input type="submit" value="Enviar">
                </div>  

            </form>

        </main>

        <footer>

            <p><small>Marcela de Meira Carvalho &amp; Murilo Bontorin Franco</small></p>
        
        </footer>

    </body>

</html>
